[project]
name = "clip-debias"
version = "0.1.0"
description = "DOVE: zero-shot concept scrubbing for image classifiers with CLIP as a concept oracle"
requires-python = ">=3.10,<3.13"
# Mirrors requirements.txt (imports actually used by the code).
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "nltk>=3.8.0",
    "accelerate>=0.24.0",
    "huggingface_hub>=0.19.0",
    "tqdm>=4.66.0",
    "sentencepiece>=0.2.2",
    "protobuf>=7.36.2",
    "open-clip-torch>=3.3.0",
]

[tool.uv]
# Scripts are run from the repo root and import clip_debias from there;
# don't build/install the package (setup.py is kept for `pip install -e .`).
package = false
